labels:
  stretch: PASS_STRETCH
  target_b: PASS_TARGET_B
  target_a: PASS_TARGET_A
  survival: PASS_SURVIVAL
  ev_only: PASS_ADAPTIVE_EV_ONLY
  fail: NO_ADAPTIVE_SYSTEM_PASSED
  insufficient_history: INSUFFICIENT_HISTORY
  blocked: BLOCKED_BY_DATA_OR_ENGINE

lane_admission:
  min_pooled_oos_trades: 60
  min_net_pnl_usdc: 0.0
  min_expectancy_usdc: 0.0
  min_profit_factor: 1.10
  min_positive_fold_ratio: 0.60
  moderate_cost_material_failure_allowed: false
  lookahead_allowed: false
  parameter_cliff_allowed: false
  severe_concentration_allowed: false

adaptive_common:
  min_pooled_oos_trades: 150
  min_pooled_oos_net_pnl_usdc: 0.0
  min_pooled_oos_expectancy_usdc: 0.0
  max_drawdown_usdc: 16.0
  final_holdout_net_pnl_must_be_positive: true
  final_holdout_expectancy_must_be_positive: true
  min_final_holdout_win_rate: 0.70
  moderate_cost_stress_must_not_be_materially_negative: true
  random_drop_10pct_fill_median_must_be_positive: true
  unresolved_data_blocker_allowed: false
  unresolved_engine_blocker_allowed: false
  lookahead_allowed: false
  severe_profit_concentration_allowed: false

survival:
  min_profit_factor: 1.15
  min_calendar_day_avg_net_pnl_usdc: 0.0

target_a:
  min_calendar_day_avg_net_pnl_usdc: 0.50
  min_pooled_oos_win_rate: 0.75
  min_profit_factor: 1.20
  min_positive_fold_ratio: 0.70

target_b:
  min_calendar_day_avg_net_pnl_usdc: 1.00
  min_pooled_oos_win_rate: 0.75
  min_profit_factor: 1.25
  adaptive_must_outperform_or_reduce_drawdown_vs_best_single_lane: true
  moderate_cost_and_fill_stress_must_be_positive: true

stretch:
  min_calendar_day_avg_net_pnl_usdc: 2.00
  min_pooled_oos_win_rate: 0.75
  min_profit_factor: 1.25
  max_required_effective_leverage: 5.0
  severe_concentration_allowed: false

concentration:
  max_single_trade_profit_share: 0.10
  max_single_month_profit_share: 0.35
  report_best_five_day_profit_share: true

stress:
  maker_fill_drop_rates: [0.05, 0.10, 0.20]
  entry_latency_minutes: [1, 2]
  emergency_exit_latency_minutes: [1, 2]
  trail_activation_latency_minutes: [1]
  parameter_neighbor_fraction: 0.10
  monte_carlo_iterations: 5000
  block_bootstrap_required: true

cost_scenarios:
  baseline: {maker_bps: 0.0, taker_bps: 4.0, slippage_bps: 1.0}
  moderate: {maker_bps: 1.0, taker_bps: 5.0, slippage_bps: 2.0}
  severe: {maker_bps: 2.0, taker_bps: 8.0, slippage_bps: 4.0}

failure_codes:
  - DATA_QUALITY_BLOCKER
  - EXECUTION_INVARIANT_FAILURE
  - LOOKAHEAD_BIAS
  - INSUFFICIENT_HISTORY
  - LOW_SAMPLE
  - OOS_NET_PNL_NON_POSITIVE
  - OOS_EXPECTANCY_NON_POSITIVE
  - OOS_WR_BELOW_TARGET
  - PROFIT_FACTOR_TOO_LOW
  - POSITIVE_FOLD_RATIO_TOO_LOW
  - MAKER_FILL_RATE_TOO_LOW
  - COST_SENSITIVE
  - FILL_SENSITIVE
  - PARAMETER_CLIFF
  - PROFIT_CONCENTRATION
  - ADAPTIVE_NOT_BETTER_THAN_SIMPLE_BASELINE
  - LEVERAGE_DEPENDENT
  - FINAL_HOLDOUT_FAILED
  - GENERALIZATION_FAILED
