  daily_realized_net_loss_cap_usdc: -2.0
  drawdown_reduce_all_usdc: -8.0
  drawdown_best_lane_only_usdc: -12.0
  drawdown_hard_disable_usdc: -16.0
  daily_reset_timezone: UTC

costs:
  baseline:
    maker_bps: 0.0
    taker_bps: 4.0
    taker_slippage_bps: 1.0
  include_funding: true
  missing_funding_policy: flag_and_report

splits:
  initial_train_months: 12
  validation_months: 3
  test_months: 3
  step_months: 3
  embargo_days: 7
  final_holdout_days: 180

governance:
  final_holdout_sealed: true
  require_frozen_manifest: true
  no_post_holdout_retuning_claim: true
  all_calendar_days_in_daily_average: true
  phase1_research_start_utc: "2024-01-05T00:00:00Z"
  phase1_research_end_utc: "2025-06-30T23:59:59.999Z"
