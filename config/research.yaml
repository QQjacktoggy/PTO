project:
  name: ETHUSDC_ADAPTIVE_MULTI_LANE_V2
  version: "2.0.0"
  date: "2026-07-25"
  timezone_storage: UTC
  timezone_report: Asia/Taipei
  random_seed: 20260725

scope:
  historical_only: true
  testnet_enabled: false
  live_enabled: false
  api_key_required: false
  dca_enabled: false
  recovery_enabled: false
  martingale_enabled: false
  reinforcement_learning_enabled: false
  unrestricted_online_learning_enabled: false

markets:
  primary:
    exchange: binance
    market_type: usd_m_futures
    symbol: ETHUSDC
  generalization:
    - symbol: BTCUSDC
      no_symbol_specific_posthoc_tuning: true
