    raw_execution: 1m
    micro_support: 5m
    signal_decision: 15m
    higher_regime: 1h
  minimum_history_days_research: 540
  desired_history_days_strict: 900
  exclude_incomplete_utc_day: true

capital:
  initial_equity_usdc: 200.0
